{% extends 'base.html' %}

{% block title %}Submit Item | University Marketplace{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1 class="text-center mb-5">Submit a New Item</h1>
    
    <form method="POST" enctype="multipart/form-data">  <!-- Add enctype here -->
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Submit Item</button>
    </form>
</div>
{% endblock %}
